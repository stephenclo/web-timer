<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Minuteur">
    <title>Minuteur — PWA</title>
    
    <!-- Lien Manifeste PWA (sera injecté dynamiquement via Blob) -->
    <link id="pwa-manifest" rel="manifest">
    
    <!-- Favicon & Apple Touch Icon (générés dynamiquement en PNG via Canvas pour l'emoji ⏰) -->
    <link id="favicon-link" rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='74' font-size='72' text-anchor='middle'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
    <link id="apple-icon-link" rel="apple-touch-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkbg: '#0b0f19',
                        darkcard: '#111827',
                        darkborder: '#1e293b',
                    }
                }
            }
        }
    </script>

    <style>
        /* Styles personnalisés pour la fluidité des animations et le clignotement d'alerte */
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Animation de clignotement intense lorsque le minuteur arrive à 00:00 */
        @keyframes alarmFlash {
            0%, 100% {
                background-color: #0b0f19;
                box-shadow: inset 0 0 0px rgba(244, 63, 94, 0);
            }
            50% {
                background-color: #2c0b14;
                box-shadow: inset 0 0 80px rgba(244, 63, 94, 0.45);
            }
        }

        @keyframes pulseText {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                color: #fb7185;
            }
            50% {
                opacity: 0.25;
                transform: scale(0.97);
                color: #ffffff;
            }
        }

        .alarm-active-bg {
            animation: alarmFlash 0.85s infinite ease-in-out;
        }

        .alarm-active-text {
            animation: pulseText 0.85s infinite ease-in-out;
        }

        /* Effet verre dépoli subtil */
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.9);
        }

        /* Transitions douces sur l'anneau SVG (rotation gérée par attribut SVG) */
        #progress-ring {
            transition: stroke 0.4s ease;
        }

        /* Ajustement strict au contenu pour la fenêtre PWA */
        html, body {
            width: fit-content;
            height: fit-content;
            min-width: fit-content;
            min-height: fit-content;
            margin: 0 auto;
        }
    </style>
</head>
<body id="app-body" class="p-2.5 flex flex-col items-center justify-center transition-colors duration-300 overflow-hidden">

    <!-- Indicateur affiché dans la fenêtre principale lorsque le minuteur est détaché en PiP -->
    <div id="pip-placeholder" class="hidden w-[235px] py-6 px-3 rounded-xl glass-panel flex-col items-center justify-center text-center gap-2">
        <span class="text-xl">⏰</span>
        <p class="text-[11px] font-medium text-slate-200 leading-snug">Minuteur ouvert en mini-fenêtre flottante</p>
        <button id="pip-restore-btn" type="button" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-cyan-300 text-[10px] font-semibold transition">
            Rappeler ici
        </button>
    </div>

    <!-- Conteneur global ultra-compact ajusté strictement au contenu -->
    <div id="app-container" class="w-[235px] flex flex-col items-center gap-2">

        <!-- En-tête minimaliste & Statut PWA -->
        <header class="w-full flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <div class="w-6 h-6 rounded-md bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-xs leading-none">
                    ⏰
                </div>
                <div>
                    <h1 class="text-xs font-semibold tracking-tight text-slate-100 leading-none">Minuteur</h1>
                    <span id="pwa-status" class="text-[9px] text-slate-400 font-medium block mt-0.5">Prêt • Hors-ligne</span>
                </div>
            </div>

            <div class="flex items-center gap-1">
                <!-- Bouton d'installation PWA (visible si le navigateur déclenche beforeinstallprompt) -->
                <button id="install-pwa-btn" class="hidden px-2 py-0.5 rounded-md bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-cyan-300 text-[10px] font-medium transition-all flex items-center gap-1">
                    <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Installer
                </button>

                <!-- Bouton Mini-fenêtre flottante (Document Picture-in-Picture) -->
                <button id="pip-toggle-btn" type="button" title="Détacher en mini-fenêtre flottante (toujours au-dessus)" class="p-1 rounded-md glass-panel hover:bg-slate-800/80 text-slate-300 hover:text-cyan-300 transition-all" aria-label="Mini-fenêtre flottante">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <rect x="11" y="11" width="9" height="7" rx="1" fill="currentColor" fill-opacity="0.35"></rect>
                    </svg>
                </button>

                <!-- Bouton test / activation son -->
                <button id="sound-toggle-btn" title="Activer/Couper le bip sonore" class="p-1 rounded-md glass-panel hover:bg-slate-800/80 text-slate-300 transition-all" aria-label="Gestion du son">
                    <svg id="icon-sound-on" class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg id="icon-sound-off" class="w-3 h-3 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Zone Centrale : Jauge Circulaire + Affichage Numérique -->
        <main class="w-full flex flex-col items-center">
            
            <!-- Conteneur du cercle SVG minimaliste (150px x 150px) -->
            <div class="relative w-[150px] h-[150px] flex items-center justify-center">

                    <!-- Piste de fond -->

                        cx="80" 
                        cy="80" 
                        r="70" 
                        fill="none"

                        stroke-width="8"

                        cx="80" 
                        cy="80" 
                        r="70" 
                        fill="none" 
                        stroke="#06b6d4" 
                        stroke-width="8" 
                        stroke-linecap="round"
                        transform="rotate(-90 80 80)"
                        stroke-dasharray="439.823"
                        stroke-dashoffset="0"

                <!-- Contenu central à l'intérieur du cercle -->

                    <!-- Indicateur d'état -->
                    <span id="status-badge" class="text-[8px] font-medium uppercase tracking-widest text-slate-400 mb-0.5">

                    <!-- Affichage numérique MM:SS (cliquable pour édition manuelle) -->

                        type="button"

                    <!-- Contrôles fins +/- 10s / 1m ultra-compacts centrés sans toucher l'anneau -->
                    <div id="fine-controls" class="flex items-center gap-0.5 mt-1">
                        <button type="button" data-adjust="-60" class="adjust-btn px-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/70 text-[7.5px] font-mono text-slate-300 leading-none transition active:scale-95">
                            -1m
                        </button>
                        <button type="button" data-adjust="-10" class="adjust-btn px-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/70 text-[7.5px] font-mono text-slate-300 leading-none transition active:scale-95">
                            -10s
                        </button>
                        <button type="button" data-adjust="10" class="adjust-btn px-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/70 text-[7.5px] font-mono text-slate-300 leading-none transition active:scale-95">
                            +10s
                        </button>
                        <button type="button" data-adjust="60" class="adjust-btn px-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/70 text-[7.5px] font-mono text-slate-300 leading-none transition active:scale-95">

                </div>
            </div>

            <!-- Boutons Principaux : Start, Stop, Réinit -->
            <div class="w-full grid grid-cols-3 gap-1.5 mt-2">
                <!-- START -->
                <button 
                    id="btn-start" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 active:scale-[0.98] text-slate-950 font-semibold text-[11px] shadow-sm shadow-cyan-500/20 transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Start</span>
                </button>

                <!-- STOP -->
                <button 
                    id="btn-stop" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg glass-panel hover:bg-slate-800/90 active:scale-[0.98] text-amber-400 border-amber-500/20 font-semibold text-[11px] transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                    </svg>
                    <span>Stop</span>
                </button>

                <!-- RÉINIT -->
                <button 
                    id="btn-reset" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg glass-panel hover:bg-slate-800/90 active:scale-[0.98] text-slate-300 font-semibold text-[11px] transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v5h5" />
                    </svg>
                    <span>Réinit</span>
                </button>
            </div>

            <!-- Présélections rapides (1, 2, 5, 10, 15 min) -->
            <section class="w-full mt-2" aria-label="Durées prédéfinies">
                <div class="grid grid-cols-5 gap-1">
                    <button type="button" data-minutes="1" class="preset-btn py-1 rounded-lg glass-panel hover:border-cyan-500/50 hover:bg-slate-800/80 text-slate-200 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="font-mono font-bold text-xs leading-tight">1</span>
                        <span class="text-[8px] text-slate-400 leading-none">min</span>
                    </button>
                    <button type="button" data-minutes="2" class="preset-btn py-1 rounded-lg glass-panel hover:border-cyan-500/50 hover:bg-slate-800/80 text-slate-200 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="font-mono font-bold text-xs leading-tight">2</span>
                        <span class="text-[8px] text-slate-400 leading-none">min</span>
                    </button>
                    <button type="button" data-minutes="5" class="preset-btn py-1 rounded-lg border border-cyan-500/60 bg-cyan-500/10 text-cyan-300 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="font-mono font-bold text-xs leading-tight">5</span>
                        <span class="text-[8px] text-cyan-400/80 leading-none">min</span>
                    </button>
                    <button type="button" data-minutes="10" class="preset-btn py-1 rounded-lg glass-panel hover:border-cyan-500/50 hover:bg-slate-800/80 text-slate-200 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="font-mono font-bold text-xs leading-tight">10</span>
                        <span class="text-[8px] text-slate-400 leading-none">min</span>
                    </button>
                    <button type="button" data-minutes="15" class="preset-btn py-1 rounded-lg glass-panel hover:border-cyan-500/50 hover:bg-slate-800/80 text-slate-200 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="font-mono font-bold text-xs leading-tight">15</span>
                        <span class="text-[8px] text-slate-400 leading-none">min</span>

    <!-- Modale d'édition manuelle du temps (compacte) -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-sm p-2">
        <div class="w-full max-w-[215px] rounded-xl bg-slate-900 border border-slate-800 p-3 shadow-2xl">
            <h3 class="text-xs font-semibold text-slate-100 mb-0.5">Durée personnalisée</h3>
            <p class="text-[10px] text-slate-400 mb-2.5">Minutes et secondes.</p>
            
            <div class="flex items-center justify-center gap-2 mb-3">
                <div class="flex flex-col items-center">
                    <label for="input-min" class="text-[9px] text-slate-400 mb-0.5">Min</label>
                    <input id="input-min" type="number" min="0" max="180" value="5" class="w-14 py-1 text-center font-mono text-base font-bold rounded-lg bg-slate-950 border border-slate-700 text-slate-100 focus:border-cyan-500 focus:outline-none">
                </div>
                <span class="font-mono text-base font-bold text-slate-500 mt-3">:</span>
                <div class="flex flex-col items-center">
                    <label for="input-sec" class="text-[9px] text-slate-400 mb-0.5">Sec</label>
                    <input id="input-sec" type="number" min="0" max="59" value="0" class="w-14 py-1 text-center font-mono text-base font-bold rounded-lg bg-slate-950 border border-slate-700 text-slate-100 focus:border-cyan-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-1.5">
                <button id="modal-cancel" type="button" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium transition">
                    Annuler
                </button>
                <button id="modal-confirm" type="button" class="py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-[11px] font-semibold transition">
                    Appliquer
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. ARCHITECTURE PWA (Icônes PNG Canvas, Manifeste & Service Worker)
         * ============================================================================
         */
        (function initPWA() {
            /**
             * Génère une véritable image PNG (Data URL) via Canvas avec l'emoji ⏰
             * sur un fond sombre arrondi (#090d16), indispensable pour Chrome/Linux PWA.
             */
            function renderEmojiPngIcon(size) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                if (!ctx) return '';

                // Fond arrondi sombre (#090d16)
                const radius = Math.round(size * 0.22);
                ctx.fillStyle = '#090d16';
                ctx.beginPath();
                ctx.moveTo(radius, 0);
                ctx.lineTo(size - radius, 0);
                ctx.quadraticCurveTo(size, 0, size, radius);
                ctx.lineTo(size, size - radius);
                ctx.quadraticCurveTo(size, size, size - radius, size);
                ctx.lineTo(radius, size);
                ctx.quadraticCurveTo(0, size, 0, size - radius);
                ctx.lineTo(0, radius);
                ctx.quadraticCurveTo(0, 0, radius, 0);
                ctx.closePath();
                ctx.fill();

                // Bordure subtile cyan
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.35)';
                ctx.lineWidth = Math.max(1.5, size * 0.025);
                ctx.stroke();

                // Dessin centré de l'emoji ⏰
                const fontSize = Math.round(size * 0.66);
                ctx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏰', size / 2, size / 2 + size * 0.04);

                return canvas.toDataURL('image/png');
            }

            const icon64Png = renderEmojiPngIcon(64);
            const icon192Png = renderEmojiPngIcon(192);
            const icon512Png = renderEmojiPngIcon(512);

            // Mise à jour immédiate de la favicon et de l'icône Apple Touch en PNG réel
            if (icon64Png) {
                document.getElementById('favicon-link').setAttribute('href', icon64Png);
            }
            if (icon192Png) {
                document.getElementById('apple-icon-link').setAttribute('href', icon192Png);
            }

            // Ajustement automatique de la fenêtre desktop lorsque lancée en mode PWA installée
            function fitWindowToContent() {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                if (!isStandalone) return;

                try {
                    const contentW = document.body.offsetWidth;
                    const contentH = document.body.offsetHeight;
                    const chromeW = Math.max(0, window.outerWidth - window.innerWidth);
                    const chromeH = Math.max(0, window.outerHeight - window.innerHeight);

                    if (contentW > 0 && contentH > 0) {
                        window.resizeTo(contentW + chromeW, contentH + chromeH);
                    }
                } catch (e) {
                    // Ignoré si le navigateur restreint resizeTo
                }
            }

            window.addEventListener('load', () => {
                requestAnimationFrame(() => {
                    fitWindowToContent();
                    setTimeout(fitWindowToContent, 150);
                });
            });

            // Création du manifeste Web App avec icônes PNG réelles
            const manifest = {
                name: 'Minuteur Dark PWA',
                short_name: 'Minuteur',
                description: 'Minuteur moderne avec thème sombre, jauge circulaire et alerte sonore.',
                start_url: location.href,
                display: 'standalone',
                background_color: '#0b0f19',
                theme_color: '#0b0f19',
                orientation: 'portrait',
                icons: [
                    {
                        src: icon192Png,
                        sizes: '192x192',
                        type: 'image/png',
                        purpose: 'any maskable'
                    },
                    {
                        src: icon512Png,
                        sizes: '512x512',
                        type: 'image/png',
                        purpose: 'any maskable'
                    }
                ]
            };

            try {
                const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const manifestURL = URL.createObjectURL(manifestBlob);
                document.getElementById('pwa-manifest').setAttribute('href', manifestURL);
            } catch (err) {
                console.warn('Impossible de créer le manifeste Blob :', err);
            }

            // Enregistrement du Service Worker via Blob (avec sécurité si exécuté en iframe sandboxée)
            const pwaStatusEl = document.getElementById('pwa-status');
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'minuteur-pwa-v1';
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim());
                    });
                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            fetch(event.request).catch(() => caches.match(event.request))
                        );
                    });
                `;
                try {
                    const swBlob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(swBlob);
                    navigator.serviceWorker.register(swUrl)
                        .then(() => {
                            pwaStatusEl.textContent = 'PWA Active • Prêt hors-ligne';
                        })
                        .catch(() => {
                            // Comportement normal dans certains environnements sandboxés / iframes
                            pwaStatusEl.textContent = 'Mode Web • Prêt';
                        });
                } catch (e) {
                    pwaStatusEl.textContent = 'Mode Web • Prêt';
                }
            }

            // Gestion de l'invite d'installation native (beforeinstallprompt)
            let deferredPrompt = null;
            const installBtn = document.getElementById('install-pwa-btn');

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.classList.remove('hidden');
            });

            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            });
        })();

        /**
         * ============================================================================
         * 2. SYNTHÉTISEUR AUDIO WEB AUDIO API (Bip électronique sans fichier externe)
         * ============================================================================
         */
        class Beeper {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.alarmInterval = null;
            }

            // Initialise ou débloque l'AudioContext lors d'une interaction utilisateur
            unlock() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Joue un bip simple et net
            playBeep(frequency = 880, duration = 0.16) {
                if (this.muted) return;
                this.unlock();
                if (!this.ctx) return;

                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);

                    // Enveloppe douce pour éviter tout clic audio désagréable
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + duration + 0.02);
                } catch (e) {
                    console.error('Erreur Web Audio:', e);
                }
            }

            // Démarre la séquence de bip répétitif de fin de minuteur
            startAlarm() {
                this.stopAlarm();
                // Double bip immédiat puis répétition toutes les 850ms (synchronisé avec le clignotement CSS)
                const triggerPattern = () => {
                    this.playBeep(880, 0.14);
                    setTimeout(() => {
                        if (this.alarmInterval) this.playBeep(1046.5, 0.18);
                    }, 180);
                };

                triggerPattern();
                this.alarmInterval = setInterval(triggerPattern, 850);
            }

            stopAlarm() {
                if (this.alarmInterval) {
                    clearInterval(this.alarmInterval);
                    this.alarmInterval = null;
                }
            }
        }

        /**
         * ============================================================================
         * 3. LOGIQUE PRINCIPALE DU MINUTEUR & JAUGE CIRCULAIRE
         * ============================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            const beeper = new Beeper();

            // Éléments DOM
            const appBody = document.getElementById('app-body');
            const appContainer = document.getElementById('app-container');
            const pipPlaceholder = document.getElementById('pip-placeholder');
            const pipToggleBtn = document.getElementById('pip-toggle-btn');
            const pipRestoreBtn = document.getElementById('pip-restore-btn');
            const timeDisplay = document.getElementById('time-display');
            const timeDisplayBtn = document.getElementById('time-display-btn');
            const statusBadge = document.getElementById('status-badge');
            const progressRing = document.getElementById('progress-ring');
            const glowBackdrop = document.getElementById('glow-backdrop');
            const dialTicks = document.getElementById('dial-ticks');

            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            const btnReset = document.getElementById('btn-reset');
            const presetBtns = document.querySelectorAll('.preset-btn');
            const adjustBtns = document.querySelectorAll('.adjust-btn');

            const soundToggleBtn = document.getElementById('sound-toggle-btn');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const iconSoundOff = document.getElementById('icon-sound-off');

            // Modale d'édition
            const editModal = document.getElementById('edit-modal');
            const inputMin = document.getElementById('input-min');
            const inputSec = document.getElementById('input-sec');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');

            // Référence vers la fenêtre Document Picture-in-Picture active
            let pipWindow = null;

            /**
             * ============================================================================
             * GESTION DE L'API DOCUMENT PICTURE-IN-PICTURE (Mini-fenêtre flottante)
             * ============================================================================
             */
            function syncAlarmClassToPip() {
                if (!pipWindow || pipWindow.closed) return;
                if (isFinished) {
                    pipWindow.document.body.classList.add('alarm-active-bg');
                } else {
                    pipWindow.document.body.classList.remove('alarm-active-bg');
                }
            }

            function restoreFromPip() {
                if (pipWindow && !pipWindow.closed) {
                    pipWindow.close();
                }
                pipWindow = null;

                // Réintégration propre du minuteur et de la modale dans la fenêtre principale
                if (appContainer.parentElement !== appBody) {
                    appBody.appendChild(appContainer);
                }
                if (editModal.parentElement !== appBody) {
                    appBody.appendChild(editModal);
                }
                pipPlaceholder.classList.add('hidden');
                pipPlaceholder.classList.remove('flex');
                pipToggleBtn.classList.remove('text-cyan-400', 'border-cyan-500/50');
            }

            async function toggleDocumentPiP() {
                // Si déjà ouvert en PiP, on le ferme et rapatrie l'interface
                if (pipWindow && !pipWindow.closed) {
                    restoreFromPip();
                    return;
                }

                // Vérification du support de l'API Document Picture-in-Picture
                if ('documentPictureInPicture' in window) {
                    try {
                        pipWindow = await window.documentPictureInPicture.requestWindow({
                            width: 255,
                            height: 345,
                        });

                        // Copie de toutes les feuilles de style et balises <style>/<script> Tailwind dans la fenêtre PiP
                        [...document.styleSheets].forEach((styleSheet) => {
                            try {
                                const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                                const style = document.createElement('style');
                                style.textContent = cssRules;
                                pipWindow.document.head.appendChild(style);
                            } catch (e) {
                                if (styleSheet.href) {
                                    const link = document.createElement('link');
                                    link.rel = 'stylesheet';
                                    link.href = styleSheet.href;
                                    pipWindow.document.head.appendChild(link);
                                }
                            }
                        });

                        // Copie des styles inline et configuration Tailwind
                        document.querySelectorAll('style').forEach((styleEl) => {
                            pipWindow.document.head.appendChild(styleEl.cloneNode(true));
                        });

                        // Configuration du body de la fenêtre PiP
                        pipWindow.document.documentElement.className = 'dark';
                        pipWindow.document.body.className = 'p-2.5 flex flex-col items-center justify-center transition-colors duration-300 overflow-hidden bg-[#0b0f19] text-slate-50';
                        pipWindow.document.title = 'Minuteur ⏰';

                        // Déplacement en direct du conteneur DOM et de la modale dans la fenêtre flottante
                        pipWindow.document.body.appendChild(appContainer);
                        pipWindow.document.body.appendChild(editModal);

                        // Affichage de l'état détaché dans la fenêtre parente
                        pipPlaceholder.classList.remove('hidden');
                        pipPlaceholder.classList.add('flex');
                        pipToggleBtn.classList.add('text-cyan-400', 'border-cyan-500/50');
                        syncAlarmClassToPip();

                        // Raccourcis clavier également actifs dans la fenêtre PiP
                        pipWindow.addEventListener('keydown', handleGlobalKeydown);

                        // Rapatriement automatique lorsque l'utilisateur ferme la fenêtre flottante
                        pipWindow.addEventListener('pagehide', () => {
                            restoreFromPip();
                        });
                    } catch (err) {
                        console.warn('Échec ouverture Document PiP, repli popup :', err);
                        window.open(location.href, 'MinuteurMini', 'width=260,height=360,menubar=no,toolbar=no,location=no,status=no');
                    }
                } else {
                    // Fallback popup compacte si le navigateur ne supporte pas Document PiP
                    window.open(location.href, 'MinuteurMini', 'width=260,height=360,menubar=no,toolbar=no,location=no,status=no');
                }
            }

            pipToggleBtn.addEventListener('click', toggleDocumentPiP);
            pipRestoreBtn.addEventListener('click', restoreFromPip);

            // Constantes géométriques du cercle SVG (viewBox 160x160, r = 70 => 2 * PI * 70 = 439.823)
            const RADIUS = 70;
            const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
            progressRing.style.strokeDasharray = `${CIRCUMFERENCE.toFixed(3)}`;
            progressRing.style.strokeDashoffset = '0';

            // Dessin des 12 repères horaires autour du cadran
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x1 = 80 + Math.cos(angle) * 59;
                const y1 = 80 + Math.sin(angle) * 59;
                const x2 = 80 + Math.cos(angle) * 63;
                const y2 = 80 + Math.sin(angle) * 63;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1.toFixed(1));
                line.setAttribute('y1', y1.toFixed(1));
                line.setAttribute('x2', x2.toFixed(1));
                line.setAttribute('y2', y2.toFixed(1));
                dialTicks.appendChild(line);
            }

            // État du minuteur (en millisecondes pour une animation 60fps ultra-fluide)
            let initialDurationMs = 5 * 60 * 1000; // 5 minutes par défaut
            let remainingMs = initialDurationMs;
            let endTimeTimestamp = null;
            let isRunning = false;
            let isFinished = false;
            let rafId = null;

            /**
             * Formate les millisecondes en chaîne MM:SS (arrondi au supérieur pendant le décompte)
             */
            function formatTime(ms) {
                const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            /**
             * Met à jour l'affichage numérique, le titre de l'onglet et la jauge SVG
             */
            function updateVisuals() {
                const formatted = formatTime(remainingMs);
                timeDisplay.textContent = formatted;

                // Mise à jour du titre de l'onglet
                if (isRunning) {
                    document.title = `${formatted} — Minuteur`;
                } else if (isFinished) {
                    document.title = `00:00 — Terminé !`;
                } else {
                    document.title = `Minuteur — PWA`;
                }

                // Calcul du ratio de progression (de 1.0 à 0.0)
                const ratio = initialDurationMs > 0 ? Math.max(0, Math.min(1, remainingMs / initialDurationMs)) : 0;
                const offset = CIRCUMFERENCE * (1 - ratio);
                progressRing.style.strokeDashoffset = offset.toFixed(3);

                // Changement progressif de couleur selon le temps restant
                if (isFinished || remainingMs === 0) {
                    progressRing.style.stroke = '#f43f5e'; // Rouge corail / Rose vif
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-rose-500/20 blur-md transition-colors duration-500 pointer-events-none';
                } else if (remainingMs <= 10000 && isRunning) {
                    // Moins de 10 secondes : alerte rouge corail
                    progressRing.style.stroke = '#fb7185';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-rose-500/15 blur-md transition-colors duration-500 pointer-events-none';
                } else if (ratio <= 0.25 && isRunning) {
                    // Dernier quart : ambre chaleureux
                    progressRing.style.stroke = '#f59e0b';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-amber-500/15 blur-md transition-colors duration-500 pointer-events-none';
                } else {
                    // Normal : cyan électrique
                    progressRing.style.stroke = '#06b6d4';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-cyan-500/10 blur-md transition-colors duration-500 pointer-events-none';
                }
            }

            /**
             * Met en surbrillance le bouton preset correspondant à la durée choisie
             */
            function highlightPreset(minutes) {
                presetBtns.forEach(btn => {
                    const btnMin = parseInt(btn.dataset.minutes, 10);
                    if (btnMin === minutes) {
                        btn.className = 'preset-btn py-1 rounded-lg border border-cyan-500/60 bg-cyan-500/10 text-cyan-300 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center';
                        btn.querySelector('span:last-child').className = 'text-[8px] text-cyan-400/80 leading-none';
                    } else {
                        btn.className = 'preset-btn py-1 rounded-lg glass-panel hover:border-cyan-500/50 hover:bg-slate-800/80 text-slate-200 font-medium text-[10px] transition-all active:scale-95 flex flex-col items-center justify-center';
                        btn.querySelector('span:last-child').className = 'text-[8px] text-slate-400 leading-none';
                    }
                });
            }

            /**
             * Désactive l'état d'alerte visuelle et sonore
             */
            function clearAlarmState() {
                isFinished = false;
                beeper.stopAlarm();
                appBody.classList.remove('alarm-active-bg');
                if (pipWindow && !pipWindow.closed) {
                    pipWindow.document.body.classList.remove('alarm-active-bg');
                }
                timeDisplay.classList.remove('alarm-active-text');
            }

            /**
             * Déclenche l'alerte de fin de minuteur (00:00)
             */
            function triggerAlarm() {
                isRunning = false;
                isFinished = true;
                remainingMs = 0;
                if (rafId) cancelAnimationFrame(rafId);

                statusBadge.textContent = 'Écoulé !';
                statusBadge.className = 'text-[8px] font-bold uppercase tracking-widest text-rose-400 mb-0.5';

                appBody.classList.add('alarm-active-bg');
                syncAlarmClassToPip();
                timeDisplay.classList.add('alarm-active-text');

                updateVisuals();
                beeper.startAlarm();
            }

            /**
             * Boucle d'animation haute précision basée sur performance.now()
             */
            function tick() {
                if (!isRunning) return;

                const now = performance.now();
                remainingMs = endTimeTimestamp - now;

                if (remainingMs <= 0) {
                    triggerAlarm();
                    return;
                }

                updateVisuals();
                rafId = requestAnimationFrame(tick);
            }

            /**
             * Démarrer le minuteur
             */
            function startTimer() {
                beeper.unlock();

                // Si l'alarme sonne, Start réinitialise et relance
                if (isFinished) {
                    clearAlarmState();
                    remainingMs = initialDurationMs;
                }

                if (isRunning || remainingMs <= 0) return;

                isRunning = true;
                endTimeTimestamp = performance.now() + remainingMs;

                statusBadge.textContent = 'En cours';
                statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-cyan-400 mb-0.5';

                rafId = requestAnimationFrame(tick);
            }

            /**
             * Mettre en pause / Arrêter l'alerte
             */
            function stopTimer() {
                if (isFinished) {
                    clearAlarmState();
                    statusBadge.textContent = 'Arrêté';
                    statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-slate-400 mb-0.5';
                    updateVisuals();
                    return;
                }

                if (!isRunning) return;

                isRunning = false;
                if (rafId) cancelAnimationFrame(rafId);
                remainingMs = Math.max(0, endTimeTimestamp - performance.now());

                statusBadge.textContent = 'Pause';
                statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-amber-400 mb-0.5';
                updateVisuals();
            }

            /**
             * Réinitialiser à la durée initiale sélectionnée
             */
            function resetTimer() {
                isRunning = false;
                if (rafId) cancelAnimationFrame(rafId);
                clearAlarmState();

                remainingMs = initialDurationMs;
                statusBadge.textContent = 'Prêt';
                statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-slate-400 mb-0.5';
                updateVisuals();
            }

            /**
             * Définit une nouvelle durée en millisecondes
             */
            function setDuration(ms, matchedPresetMinutes = null) {
                beeper.unlock();
                isRunning = false;
                if (rafId) cancelAnimationFrame(rafId);
                clearAlarmState();

                initialDurationMs = Math.max(1000, ms);
                remainingMs = initialDurationMs;

                statusBadge.textContent = 'Prêt';
                statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-slate-400 mb-0.5';

                highlightPreset(matchedPresetMinutes);
                updateVisuals();
            }

            // Écouteurs des boutons principaux
            btnStart.addEventListener('click', startTimer);
            btnStop.addEventListener('click', stopTimer);
            btnReset.addEventListener('click', resetTimer);

            // Écouteurs des présélections (1, 2, 5, 10, 15 min)
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const minutes = parseInt(btn.dataset.minutes, 10);
                    setDuration(minutes * 60 * 1000, minutes);
                });
            });

            // Écouteurs des boutons d'ajustement fin (-1m, -10s, +10s, +1m)
            adjustBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    beeper.unlock();
                    if (isFinished) clearAlarmState();

                    const deltaMs = parseInt(btn.dataset.adjust, 10) * 1000;
                    if (isRunning) {
                        endTimeTimestamp = Math.max(performance.now() + 1000, endTimeTimestamp + deltaMs);
                        remainingMs = endTimeTimestamp - performance.now();
                        initialDurationMs = Math.max(initialDurationMs, remainingMs);
                    } else {
                        const nextMs = Math.max(5000, remainingMs + deltaMs);
                        initialDurationMs = nextMs;
                        remainingMs = nextMs;
                        statusBadge.textContent = 'Prêt';
                        statusBadge.className = 'text-[8px] font-medium uppercase tracking-widest text-slate-400 mb-0.5';
                    }

                    // Vérifie si la nouvelle durée correspond à un preset
                    const exactMinutes = remainingMs % 60000 === 0 ? remainingMs / 60000 : null;
                    highlightPreset([1, 2, 5, 10, 15].includes(exactMinutes) ? exactMinutes : null);
                    updateVisuals();
                });
            });

            // Gestion du bouton muet / test son
            soundToggleBtn.addEventListener('click', () => {
                beeper.muted = !beeper.muted;
                if (beeper.muted) {
                    beeper.stopAlarm();
                    iconSoundOn.classList.add('hidden');
                    iconSoundOff.classList.remove('hidden');
                } else {
                    iconSoundOn.classList.remove('hidden');
                    iconSoundOff.classList.add('hidden');
                    beeper.playBeep(880, 0.1);
                }
            });

            // Modale d'édition manuelle au clic sur l'affichage numérique
            timeDisplayBtn.addEventListener('click', () => {
                stopTimer();
                const totalSec = Math.ceil(remainingMs / 1000);
                inputMin.value = Math.floor(totalSec / 60);
                inputSec.value = totalSec % 60;
                editModal.classList.remove('hidden');
                editModal.classList.add('flex');
                inputMin.focus();
                inputMin.select();
            });

            function closeModal() {
                editModal.classList.add('hidden');
                editModal.classList.remove('flex');
            }

            modalCancel.addEventListener('click', closeModal);
            editModal.addEventListener('click', (e) => {
                if (e.target === editModal) closeModal();
            });

            modalConfirm.addEventListener('click', () => {
                const m = Math.max(0, Math.min(180, parseInt(inputMin.value, 10) || 0));
                const s = Math.max(0, Math.min(59, parseInt(inputSec.value, 10) || 0));
                const totalMs = (m * 60 + s) * 1000;
                if (totalMs > 0) {
                    const matchedPreset = (s === 0 && [1, 2, 5, 10, 15].includes(m)) ? m : null;
                    setDuration(totalMs, matchedPreset);
                }
                closeModal();
            });

            // Raccourcis clavier pratiques (Espace pour Start/Stop, R pour Réinit)
            function handleGlobalKeydown(e) {
                if (!editModal.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeModal();
                    if (e.key === 'Enter') modalConfirm.click();
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    if (isRunning || isFinished) {
                        stopTimer();
                    } else {
                        startTimer();
                    }
                } else if (e.key.toLowerCase() === 'r') {
                    resetTimer();
                }
            }

            window.addEventListener('keydown', handleGlobalKeydown);

            // Initialisation visuelle
            updateVisuals();
        });
    </script>
</body>
</html>
