<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Minuteur">
    <title>Minuteur — PWA</title>
    
    <!-- Lien Manifeste PWA (injecté dynamiquement en data: URL) -->
    <link id="pwa-manifest" rel="manifest">
    
    <!-- Favicon & Apple Touch Icon (générés dynamiquement en PNG haute résolution via Canvas pour l'emoji ⏰) -->
    <link id="favicon-link" rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='74' font-size='72' text-anchor='middle'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
    <link id="apple-icon-link" rel="apple-touch-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkbg: '#0b0f19',
                        darkcard: '#111827',
                        darkborder: '#1e293b',
                    }
                }
            }
        }
    </script>

    <style>
        /* Styles de base et ergonomie */
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Animation de clignotement d'alerte lorsque le minuteur arrive à 00:00 */
        @keyframes alarmFlash {
            0%, 100% {
                background-color: #0b0f19;
                box-shadow: inset 0 0 0px rgba(244, 63, 94, 0);
            }
            50% {
                background-color: #2c0b14;
                box-shadow: inset 0 0 80px rgba(244, 63, 94, 0.45);
            }
        }

        @keyframes pulseText {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                color: #fb7185;
            }
            50% {
                opacity: 0.25;
                transform: scale(0.97);
                color: #ffffff;
            }
        }

        .alarm-active-bg {
            animation: alarmFlash 0.85s infinite ease-in-out;
        }

        .alarm-active-text {
            animation: pulseText 0.85s infinite ease-in-out;
        }

        /* Effet verre dépoli subtil */
        .glass-panel {
            background: rgba(17, 24, 39, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.9);
        }

        /* Transitions douces sur l'anneau SVG (rotation gérée par attribut SVG) */
        #progress-ring {
            transition: stroke 0.4s ease;
        }

        /* Garantie explicite d'interactivité sur tous les boutons */
        button, [data-minutes], [data-adjust] {
            pointer-events: auto !important;
            cursor: pointer !important;
            position: relative;
            z-index: 10;
        }

        /* Ajustement strict au contenu en mode fenêtre standard / PWA */
        html, body {
            width: fit-content;
            height: fit-content;
            min-width: fit-content;
            min-height: fit-content;
            margin: 0 auto;
        }

        /* Mode Document Picture-in-Picture : suppression totale de l'espace vide */
        html.is-pip, html.is-pip body {
            width: 100% !important;
            height: 100% !important;
            min-width: 100% !important;
            min-height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        html.is-pip #app-card {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            padding: 8px 10px !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            box-sizing: border-box !important;
        }

        html.is-pip #dial-container {
            width: 146px !important;
            height: 146px !important;
        }

        html.is-pip #time-display {
            font-size: 31px !important;
        }

        html.is-pip #header-title-group {
            display: none !important;
        }

        html.is-pip #app-header {
            position: absolute;
            top: 4px;
            right: 6px;
            width: auto !important;
            z-index: 20;
        }

        html.is-pip #app-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
        }
    </style>
</head>
<body id="app-body" class="p-2 flex flex-col items-center justify-center transition-colors duration-300 overflow-hidden">

    <!-- Indicateur affiché dans la fenêtre principale lorsque le minuteur est détaché en PiP -->
    <div id="pip-placeholder" class="hidden w-[275px] py-6 px-4 rounded-2xl glass-panel flex-col items-center justify-center text-center gap-2.5">
        <span class="text-2xl">⏰</span>
        <p class="text-xs font-medium text-slate-200 leading-snug">Minuteur ouvert en mini-fenêtre flottante</p>
        <button id="pip-restore-btn" type="button" class="px-3 py-1.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-cyan-300 text-xs font-semibold transition">
            Rappeler ici
        </button>
    </div>

    <!-- Carte principale compacte et lisible (#app-card occupe 100% en mode PiP) -->
    <div id="app-card" class="relative w-[275px] p-3 rounded-2xl glass-panel flex flex-col items-center justify-between gap-2.5">

        <!-- En-tête minimaliste (texte masqué automatiquement en mode PiP) -->
        <header id="app-header" class="w-full flex items-center justify-between">
            <div id="header-title-group">
                <h1 class="text-sm font-semibold tracking-tight text-slate-100 leading-none">Minuteur</h1>
                <span id="pwa-status" class="text-[11px] text-slate-400 font-medium block mt-0.5">Hors-ligne</span>
            </div>

            <div class="flex items-center gap-1.5 ml-auto">
                <!-- Bouton Mini-fenêtre flottante (Document Picture-in-Picture) -->
                <button id="pip-toggle-btn" type="button" title="Détacher / Quitter la mini-fenêtre flottante" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/80 text-slate-200 hover:text-cyan-300 transition-all" aria-label="Mini-fenêtre flottante">
                    <svg id="icon-pip-enter" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <rect x="11" y="11" width="9" height="7" rx="1" fill="currentColor" fill-opacity="0.35"></rect>
                    </svg>
                    <svg id="icon-pip-exit" class="w-4 h-4 hidden text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9L4 4m0 0v4m0-4h4M15 15l5 5m0 0v-4m0 4h-4" />
                    </svg>
                </button>
                <!-- Bouton test / activation son (synchronisé avec l'état réel de l'AudioContext) -->
                <button id="sound-toggle-btn" type="button" title="Son en attente d'activation — Cliquer pour activer" class="relative p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/90 border border-amber-500/40 text-slate-200 transition-all" aria-label="Gestion du son">
                    <svg id="icon-sound-on" class="w-4 h-4 text-amber-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg id="icon-sound-off" class="w-4 h-4 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <!-- Point d'attention ambre lorsque l'autoplay audio est bloqué par le navigateur -->
                    <span id="sound-pending-dot" class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-amber-400 ring-2 ring-[#0b0f19]"></span>
                </button>
            </div>
        </header>

        <!-- Zone Centrale : Jauge Circulaire + Contrôles -->
        <main id="app-main" class="w-full flex flex-col items-center gap-2.5">
            
            <!-- Conteneur du cercle SVG (164px en normal, 146px en PiP) -->
            <div id="dial-container" class="relative w-[164px] h-[164px] flex items-center justify-center mx-auto">
                <!-- Halo lumineux arrière-plan sans filtre SVG -->
                <div id="glow-backdrop" class="absolute inset-3 rounded-full bg-cyan-500/10 blur-md transition-colors duration-500 pointer-events-none"></div>

                <!-- SVG Jauge propre sans drop-shadow ni transform CSS -->
                <svg class="w-full h-full block" viewBox="0 0 160 160" shape-rendering="geometricPrecision">
                    <!-- Piste de fond -->
                    <circle 
                        cx="80" 
                        cy="80" 
                        r="70" 
                        fill="none" 
                        stroke="#1e293b" 
                        stroke-width="8"
                    />
                    <!-- Graduations subtiles (12 repères) -->
                    <g id="dial-ticks" stroke="#334155" stroke-width="1.5" stroke-linecap="round"></g>
                    <!-- Anneau de progression dynamique (masqué tant que non démarré) -->
                    <circle 
                        id="progress-ring" 
                        cx="80" 
                        cy="80" 
                        r="70" 
                        fill="none" 
                        stroke="#06b6d4" 
                        stroke-width="8" 
                        stroke-linecap="round"
                        transform="rotate(-90 80 80)"
                        stroke-dasharray="439.823"
                        stroke-dashoffset="439.823"
                        style="opacity: 0;"
                    />
                </svg>

                <!-- Contenu central à l'intérieur du cercle -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <!-- Indicateur d'état (affiché uniquement en PAUSE) -->
                    <span id="status-badge" class="hidden text-xs font-semibold uppercase tracking-wider text-amber-400 mb-0.5">
                        Pause
                    </span>

                    <!-- Affichage numérique MM:SS (cliquable pour édition manuelle) -->
                    <button 
                        id="time-display-btn" 
                        type="button"
                        title="Cliquez pour modifier la durée"
                        class="group relative flex items-center justify-center px-1.5 py-0.5 rounded-lg hover:bg-slate-800/50 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
                    >
                        <span id="time-display" class="font-mono text-4xl font-bold tracking-tight text-slate-50 tabular-nums leading-none">
                            05:00
                        </span>
                    </button>

                    <!-- Contrôles fins +/- 10s / 1m lisibles et contrastés -->
                    <div id="fine-controls" class="flex items-center gap-1 mt-1.5">
                        <button type="button" data-adjust="-60" class="adjust-btn px-1.5 py-0.5 rounded bg-slate-800/95 hover:bg-slate-700 border border-slate-600/80 text-[11px] font-mono font-semibold text-slate-100 leading-none transition active:scale-95">
                            -1m
                        </button>
                        <button type="button" data-adjust="-10" class="adjust-btn px-1.5 py-0.5 rounded bg-slate-800/95 hover:bg-slate-700 border border-slate-600/80 text-[11px] font-mono font-semibold text-slate-100 leading-none transition active:scale-95">
                            -10s
                        </button>
                        <button type="button" data-adjust="10" class="adjust-btn px-1.5 py-0.5 rounded bg-slate-800/95 hover:bg-slate-700 border border-slate-600/80 text-[11px] font-mono font-semibold text-slate-100 leading-none transition active:scale-95">
                            +10s
                        </button>
                        <button type="button" data-adjust="60" class="adjust-btn px-1.5 py-0.5 rounded bg-slate-800/95 hover:bg-slate-700 border border-slate-600/80 text-[11px] font-mono font-semibold text-slate-100 leading-none transition active:scale-95">
                            +1m
                        </button>
                    </div>
                </div>
            </div>

            <!-- Boutons Principaux : Start, Stop, Réinit -->
            <div class="w-full grid grid-cols-3 gap-1.5">
                <!-- START -->
                <button 
                    id="btn-start" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 active:scale-[0.98] text-slate-950 font-bold text-sm shadow-sm shadow-cyan-500/20 transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Start</span>
                </button>

                <!-- PAUSE -->
                <button 
                    id="btn-stop" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg bg-slate-800/90 hover:bg-slate-700 active:scale-[0.98] text-amber-300 border border-amber-500/40 font-bold text-sm transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                    </svg>
                    <span>Pause</span>
                </button>

                <!-- RÉINIT -->
                <button 
                    id="btn-reset" 
                    type="button"
                    class="py-1.5 px-2 rounded-lg bg-slate-800/90 hover:bg-slate-700 active:scale-[0.98] text-slate-100 border border-slate-600/80 font-bold text-sm transition-all flex items-center justify-center gap-1 cursor-pointer"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v5h5" />
                    </svg>
                    <span>Réinit</span>
                </button>
            </div>

            <!-- Présélections rapides (1, 2, 5, 10, 15 min) -->
            <section class="w-full" aria-label="Durées prédéfinies">
                <div class="grid grid-cols-5 gap-1">
                    <button type="button" data-minutes="1" class="preset-btn py-1.5 rounded-lg bg-slate-800/85 border border-slate-700/80 hover:border-cyan-500/60 hover:bg-slate-800 text-slate-100 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center">
                        <span class="font-mono">1m</span>
                    </button>
                    <button type="button" data-minutes="2" class="preset-btn py-1.5 rounded-lg bg-slate-800/85 border border-slate-700/80 hover:border-cyan-500/60 hover:bg-slate-800 text-slate-100 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center">
                        <span class="font-mono">2m</span>
                    </button>
                    <button type="button" data-minutes="5" class="preset-btn py-1.5 rounded-lg border border-cyan-500/70 bg-cyan-500/20 text-cyan-200 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center">
                        <span class="font-mono">5m</span>
                    </button>
                    <button type="button" data-minutes="10" class="preset-btn py-1.5 rounded-lg bg-slate-800/85 border border-slate-700/80 hover:border-cyan-500/60 hover:bg-slate-800 text-slate-100 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center">
                        <span class="font-mono">10m</span>
                    </button>
                    <button type="button" data-minutes="15" class="preset-btn py-1.5 rounded-lg bg-slate-800/85 border border-slate-700/80 hover:border-cyan-500/60 hover:bg-slate-800 text-slate-100 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center">
                        <span class="font-mono">15m</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modale d'édition manuelle du temps -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-sm p-2">
        <div class="w-full max-w-[235px] rounded-xl bg-slate-900 border border-slate-700 p-3 shadow-2xl">
            <h3 class="text-sm font-semibold text-slate-100 mb-0.5">Durée personnalisée</h3>
            <p class="text-xs text-slate-300 mb-2.5">Minutes et secondes.</p>
            
            <div class="flex items-center justify-center gap-2 mb-3">
                <div class="flex flex-col items-center">
                    <label for="input-min" class="text-[11px] font-medium text-slate-300 mb-1">Min</label>
                    <input id="input-min" type="number" min="0" max="180" value="5" class="w-16 py-1.5 text-center font-mono text-lg font-bold rounded-lg bg-slate-950 border border-slate-600 text-slate-100 focus:border-cyan-500 focus:outline-none">
                </div>
                <span class="font-mono text-lg font-bold text-slate-400 mt-4">:</span>
                <div class="flex flex-col items-center">
                    <label for="input-sec" class="text-[11px] font-medium text-slate-300 mb-1">Sec</label>
                    <input id="input-sec" type="number" min="0" max="59" value="0" class="w-16 py-1.5 text-center font-mono text-lg font-bold rounded-lg bg-slate-950 border border-slate-600 text-slate-100 focus:border-cyan-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="modal-cancel" type="button" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition">
                    Annuler
                </button>
                <button id="modal-confirm" type="button" class="py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition">
                    Appliquer
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. INITIALISATION PWA SÉCURISÉE (Icônes PNG ⏰ Canvas + Manifeste sans SW bloquant)
         * ============================================================================
         */
        function initPWA() {
            try {
                // Désinscription préventive d'anciens Service Workers blob: éventuels
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then((registrations) => {
                        registrations.forEach((reg) => {
                            if (reg.active && reg.active.scriptURL && reg.active.scriptURL.startsWith('blob:')) {
                                reg.unregister().catch(() => {});
                            }
                        });
                    }).catch(() => {});
                }

                // Génération dynamique des icônes PNG haute résolution via Canvas
                const generateEmojiPng = (size) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return null;

                    const radius = size * 0.22;
                    ctx.fillStyle = '#090d16';
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(size - radius, 0);
                    ctx.quadraticCurveTo(size, 0, size, radius);
                    ctx.lineTo(size, size - radius);
                    ctx.quadraticCurveTo(size, size, size - radius, size);
                    ctx.lineTo(radius, size);
                    ctx.quadraticCurveTo(0, size, 0, size - radius);
                    ctx.lineTo(0, radius);
                    ctx.quadraticCurveTo(0, 0, radius, 0);
                    ctx.closePath();
                    ctx.fill();

                    ctx.font = `${Math.round(size * 0.66)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⏰', size / 2, size / 2 + size * 0.04);

                    return canvas.toDataURL('image/png');
                };

                const icon64 = generateEmojiPng(64);
                const icon192 = generateEmojiPng(192);
                const icon512 = generateEmojiPng(512);

                if (icon64) {
                    const fav = document.getElementById('favicon-link');
                    if (fav) fav.href = icon64;
                }
                if (icon192) {
                    const appleIcon = document.getElementById('apple-icon-link');
                    if (appleIcon) appleIcon.href = icon192;
                }

                if (icon192 && icon512) {
                    const manifest = {
                        name: 'Minuteur PWA',
                        short_name: 'Minuteur',
                        description: 'Minuteur compact en thème sombre avec jauge circulaire',
                        start_url: location.href,
                        display: 'standalone',
                        background_color: '#0b0f19',
                        theme_color: '#090d16',
                        icons: [
                            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                        ]
                    };
                    const manifestLink = document.getElementById('pwa-manifest');
                    if (manifestLink) {
                        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
                    }
                }
            } catch (err) {
                console.warn('Initialisation PWA ignorée:', err);
            }
        }

        /**
         * ============================================================================
         * 2. SYNTHÉTISEUR AUDIO WEB AUDIO API (Synchronisé avec l'état réel du navigateur)
         * ============================================================================
         */
        class Beeper {
            constructor(onStateChangeCallback = null) {
                this.ctx = null;
                this.soundEnabled = true;
                this.alarmInterval = null;
                this.onStateChangeCallback = onStateChangeCallback;
                try {
                    this.initContext();
                } catch (e) {
                    console.warn('AudioContext différé:', e);
                }
            }

            /**
             * Initialise l'AudioContext dès le démarrage et écoute ses changements d'état
             */
            initContext() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            this.ctx = new AudioCtx();
                            this.ctx.onstatechange = () => {
                                if (this.onStateChangeCallback) {
                                    this.onStateChangeCallback(this.getAudioStatus());
                                }
                            };
                        }
                    }
                    if (this.ctx && this.ctx.state === 'suspended' && this.soundEnabled) {
                        this.ctx.resume().catch(() => {
                            if (this.onStateChangeCallback) {
                                this.onStateChangeCallback(this.getAudioStatus());
                            }
                        });
                    }
                } catch (e) {
                    // Protection contre toute exception navigateur
                }
                if (this.onStateChangeCallback) {
                    this.onStateChangeCallback(this.getAudioStatus());
                }
            }

            /**
             * Retourne l'état audio exact : 'muted', 'ready' ou 'pending'
             */
            getAudioStatus() {
                if (!this.soundEnabled) return 'muted';
                if (this.ctx && this.ctx.state === 'running') return 'ready';
                return 'pending';
            }

            /**
             * Débloque l'AudioContext lors d'un geste utilisateur
             */
            async unlock() {
                this.initContext();
                if (this.ctx && this.ctx.state === 'suspended') {
                    try {
                        await this.ctx.resume();
                    } catch (e) {
                        // En attente d'une interaction directe autorisée
                    }
                }
                if (this.onStateChangeCallback) {
                    this.onStateChangeCallback(this.getAudioStatus());
                }
            }

            async playBeep(frequency = 880, duration = 0.16) {
                if (!this.soundEnabled) return;
                await this.unlock();
                if (!this.ctx || this.ctx.state !== 'running') return;

                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + duration + 0.02);
                } catch (e) {
                    console.error('Erreur Web Audio:', e);
                }
            }

            startAlarm() {
                this.stopAlarm();
                const triggerPattern = () => {
                    this.playBeep(880, 0.14);
                    setTimeout(() => {
                        if (this.alarmInterval) this.playBeep(1046.5, 0.18);
                    }, 180);
                };

                triggerPattern();
                this.alarmInterval = setInterval(triggerPattern, 850);
            }

            stopAlarm() {
                if (this.alarmInterval) {
                    clearInterval(this.alarmInterval);
                    this.alarmInterval = null;
                }
            }
        }

        /**
         * ============================================================================
         * 3. LOGIQUE PRINCIPALE DU MINUTEUR & DOCUMENT PICTURE-IN-PICTURE
         * ============================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            initPWA();

            // Éléments DOM
            const appBody = document.getElementById('app-body');
            const appCard = document.getElementById('app-card');
            const pipPlaceholder = document.getElementById('pip-placeholder');
            const pipToggleBtn = document.getElementById('pip-toggle-btn');
            const pipRestoreBtn = document.getElementById('pip-restore-btn');
            const iconPipEnter = document.getElementById('icon-pip-enter');
            const iconPipExit = document.getElementById('icon-pip-exit');

            const timeDisplay = document.getElementById('time-display');
            const timeDisplayBtn = document.getElementById('time-display-btn');
            const statusBadge = document.getElementById('status-badge');
            const progressRing = document.getElementById('progress-ring');
            const glowBackdrop = document.getElementById('glow-backdrop');
            const dialTicks = document.getElementById('dial-ticks');

            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            const btnReset = document.getElementById('btn-reset');
            const presetBtns = document.querySelectorAll('.preset-btn');
            const adjustBtns = document.querySelectorAll('.adjust-btn');

            const soundToggleBtn = document.getElementById('sound-toggle-btn');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const soundPendingDot = document.getElementById('sound-pending-dot');

            // Modale d'édition
            const editModal = document.getElementById('edit-modal');
            const inputMin = document.getElementById('input-min');
            const inputSec = document.getElementById('input-sec');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');

            /**
             * Synchronise l'icône haut-parleur avec l'état réel de l'AudioContext
             */
            function updateSoundIconUI(status) {
                if (status === 'muted') {
                    iconSoundOn.classList.add('hidden');
                    iconSoundOff.classList.remove('hidden');
                    soundPendingDot.classList.add('hidden');
                    soundToggleBtn.className = 'relative p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/80 text-slate-400 transition-all';
                    soundToggleBtn.title = 'Son coupé — Cliquer pour activer';
                } else if (status === 'ready') {
                    iconSoundOn.classList.remove('hidden');
                    iconSoundOn.className = 'w-4 h-4 text-cyan-400 transition-colors';
                    iconSoundOff.classList.add('hidden');
                    soundPendingDot.classList.add('hidden');
                    soundToggleBtn.className = 'relative p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/80 text-slate-200 transition-all';
                    soundToggleBtn.title = 'Son activé — Cliquer pour couper';
                } else {
                    // État 'pending' : soundEnabled === true mais AudioContext suspendu par le navigateur
                    iconSoundOn.classList.remove('hidden');
                    iconSoundOn.className = 'w-4 h-4 text-amber-400 transition-colors';
                    iconSoundOff.classList.add('hidden');
                    soundPendingDot.classList.remove('hidden');
                    soundToggleBtn.className = 'relative p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/90 border border-amber-500/45 text-amber-300 transition-all';
                    soundToggleBtn.title = 'Cliquer pour activer le son';
                }
            }

            const beeper = new Beeper(updateSoundIconUI);

            /**
             * Débloque automatiquement l'AudioContext dès la première interaction sur un document
             */
            function bindAudioUnlockEvents(targetDoc) {
                if (!targetDoc) return;
                const handleFirstGesture = () => {
                    if (beeper.soundEnabled && beeper.getAudioStatus() !== 'ready') {
                        beeper.unlock();
                    }
                };
                targetDoc.addEventListener('pointerdown', handleFirstGesture, { passive: true });
                targetDoc.addEventListener('keydown', handleFirstGesture, { passive: true });
                targetDoc.addEventListener('click', handleFirstGesture, { passive: true });
            }

            bindAudioUnlockEvents(document);

            let pipWindow = null;

            /**
             * Synchronise l'animation de clignotement d'alerte vers la fenêtre PiP si ouverte
             */
            function syncAlarmClassToPip() {
                if (pipWindow && !pipWindow.closed && isFinished) {
                    pipWindow.document.body.classList.add('alarm-active-bg');
                    appCard.classList.add('alarm-active-bg');
                }
            }

            /**
             * Ouvre ou ferme la mini-fenêtre flottante Document Picture-in-Picture (275x310px)
             */
            async function toggleDocumentPiP() {
                if (pipWindow && !pipWindow.closed) {
                    restoreFromPip();
                    return;
                }

                if ('documentPictureInPicture' in window) {
                    try {
                        pipWindow = await window.documentPictureInPicture.requestWindow({
                            width: 275,
                            height: 310,
                        });

                        // Injection de toutes les règles CSS et styles Tailwind dans la fenêtre PiP
                        [...document.styleSheets].forEach((styleSheet) => {
                            try {
                                const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                                const style = document.createElement('style');
                                style.textContent = cssRules;
                                pipWindow.document.head.appendChild(style);
                            } catch (e) {
                                if (styleSheet.href) {
                                    const link = document.createElement('link');
                                    link.rel = 'stylesheet';
                                    link.href = styleSheet.href;
                                    pipWindow.document.head.appendChild(link);
                                }
                            }
                        });

                        document.querySelectorAll('style').forEach((styleEl) => {
                            pipWindow.document.head.appendChild(styleEl.cloneNode(true));
                        });

                        // Activation du mode plein cadre sans espace vide (html.is-pip)
                        pipWindow.document.documentElement.className = 'dark is-pip';
                        pipWindow.document.body.className = 'bg-[#090d16] text-slate-50 transition-colors duration-300 overflow-hidden m-0 p-0';
                        pipWindow.document.title = 'Minuteur ⏰';

                        // Déplacement en direct de #app-card et de la modale dans la fenêtre PiP
                        pipWindow.document.body.appendChild(appCard);
                        pipWindow.document.body.appendChild(editModal);

                        // Déblocage audio également sur toute interaction dans la fenêtre PiP
                        bindAudioUnlockEvents(pipWindow.document);

                        // Forcer l'ajustement exact aux dimensions lisibles juste après l'injection
                        try {
                            pipWindow.resizeTo(275, 310);
                            requestAnimationFrame(() => {
                                try {
                                    pipWindow.resizeTo(275, 310);
                                } catch (e) {}
                            });
                        } catch (e) {}

                        // Mise à jour des boutons et de l'état de la fenêtre parente
                        pipPlaceholder.classList.remove('hidden');
                        pipPlaceholder.classList.add('flex');
                        iconPipEnter.classList.add('hidden');
                        iconPipExit.classList.remove('hidden');
                        pipToggleBtn.classList.add('border-cyan-500/50');
                        syncAlarmClassToPip();

                        // Raccourcis clavier également actifs dans la fenêtre PiP
                        pipWindow.addEventListener('keydown', handleGlobalKeydown);

                        // Rapatriement automatique à la fermeture
                        pipWindow.addEventListener('pagehide', () => {
                            restoreFromPip();
                        });
                    } catch (err) {
                        console.warn('Échec ouverture Document PiP, repli popup :', err);
                        window.open(location.href, 'MinuteurMini', 'width=275,height=310,menubar=no,toolbar=no,location=no,status=no');
                    }
                } else {
                    window.open(location.href, 'MinuteurMini', 'width=275,height=310,menubar=no,toolbar=no,location=no,status=no');
                }
            }

            /**
             * Rapatrie le minuteur dans la fenêtre principale à la fermeture du PiP
             */
            function restoreFromPip() {
                if (pipWindow && !pipWindow.closed) {
                    try {
                        pipWindow.close();
                    } catch (e) {}
                }
                pipWindow = null;

                document.documentElement.classList.remove('is-pip');
                appCard.classList.remove('alarm-active-bg');
                appCard.style.display = 'flex';
                appCard.style.pointerEvents = 'auto';

                if (appCard.parentElement !== appBody) {
                    appBody.appendChild(appCard);
                }
                if (editModal.parentElement !== appBody) {
                    appBody.appendChild(editModal);
                }

                pipPlaceholder.classList.add('hidden');
                pipPlaceholder.classList.remove('flex');
                iconPipEnter.classList.remove('hidden');
                iconPipExit.classList.add('hidden');
                pipToggleBtn.classList.remove('border-cyan-500/50');
            }

            // Constantes géométriques du cercle SVG (viewBox 160x160, r = 70 => 2 * PI * 70 = 439.823)
            const RADIUS = 70;
            const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
            progressRing.style.strokeDasharray = `${CIRCUMFERENCE.toFixed(3)}`;
            progressRing.style.strokeDashoffset = `${CIRCUMFERENCE.toFixed(3)}`;

            // Dessin des 12 repères horaires autour du cadran
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x1 = 80 + Math.cos(angle) * 59;
                const y1 = 80 + Math.sin(angle) * 59;
                const x2 = 80 + Math.cos(angle) * 63;
                const y2 = 80 + Math.sin(angle) * 63;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1.toFixed(1));
                line.setAttribute('y1', y1.toFixed(1));
                line.setAttribute('x2', x2.toFixed(1));
                line.setAttribute('y2', y2.toFixed(1));
                dialTicks.appendChild(line);
            }

            // État du minuteur
            let initialDurationMs = 5 * 60 * 1000;
            let remainingMs = initialDurationMs;
            let endTimeTimestamp = null;
            let isRunning = false;
            let isStarted = false;
            let isFinished = false;
            let rafId = null;

            function formatTime(ms) {
                const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            function updateVisuals() {
                const formatted = formatTime(remainingMs);
                timeDisplay.textContent = formatted;

                if (isRunning) {
                    document.title = `${formatted} — Minuteur`;
                } else if (isFinished) {
                    document.title = `00:00 — Minuteur`;
                } else {
                    document.title = `Minuteur — PWA`;
                }

                // Si le minuteur n'a pas été démarré ou vient d'être réinitialisé, masquer l'anneau coloré
                if (!isStarted && !isFinished) {
                    progressRing.style.strokeDashoffset = `${CIRCUMFERENCE.toFixed(3)}`;
                    progressRing.style.opacity = '0';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-slate-800/10 blur-md transition-colors duration-500 pointer-events-none';
                    return;
                }

                progressRing.style.opacity = '1';
                const ratio = initialDurationMs > 0 ? Math.max(0, Math.min(1, remainingMs / initialDurationMs)) : 0;
                const offset = CIRCUMFERENCE * (1 - ratio);
                progressRing.style.strokeDashoffset = offset.toFixed(3);

                if (isFinished || remainingMs === 0) {
                    progressRing.style.stroke = '#f43f5e';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-rose-500/20 blur-md transition-colors duration-500 pointer-events-none';
                } else if (remainingMs <= 10000 && isRunning) {
                    progressRing.style.stroke = '#fb7185';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-rose-500/15 blur-md transition-colors duration-500 pointer-events-none';
                } else if (ratio <= 0.25 && isRunning) {
                    progressRing.style.stroke = '#f59e0b';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-amber-500/15 blur-md transition-colors duration-500 pointer-events-none';
                } else {
                    progressRing.style.stroke = '#06b6d4';
                    glowBackdrop.className = 'absolute inset-2 rounded-full bg-cyan-500/10 blur-md transition-colors duration-500 pointer-events-none';
                }
            }

            function highlightPreset(minutes) {
                presetBtns.forEach(btn => {
                    const btnMin = parseInt(btn.dataset.minutes, 10);
                    if (btnMin === minutes) {
                        btn.className = 'preset-btn py-1.5 rounded-lg border border-cyan-500/70 bg-cyan-500/20 text-cyan-200 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center';
                    } else {
                        btn.className = 'preset-btn py-1.5 rounded-lg bg-slate-800/85 border border-slate-700/80 hover:border-cyan-500/60 hover:bg-slate-800 text-slate-100 font-semibold text-[13px] transition-all active:scale-95 flex items-center justify-center';
                    }
                });
            }

            function clearAlarmState() {
                isFinished = false;
                beeper.stopAlarm();
                appBody.classList.remove('alarm-active-bg');
                appCard.classList.remove('alarm-active-bg');
                if (pipWindow && !pipWindow.closed) {
                    pipWindow.document.body.classList.remove('alarm-active-bg');
                }
                timeDisplay.classList.remove('alarm-active-text');
            }

            function triggerAlarm() {
                isRunning = false;
                isStarted = false;
                isFinished = true;
                remainingMs = 0;
                if (rafId) cancelAnimationFrame(rafId);

                statusBadge.classList.add('hidden');

                appBody.classList.add('alarm-active-bg');
                syncAlarmClassToPip();
                timeDisplay.classList.add('alarm-active-text');

                updateVisuals();
                beeper.startAlarm();
            }

            function tick() {
                if (!isRunning) return;

                const now = performance.now();
                remainingMs = endTimeTimestamp - now;

                if (remainingMs <= 0) {
                    triggerAlarm();
                    return;
                }

                updateVisuals();
                rafId = requestAnimationFrame(tick);
            }

            function startTimer() {
                beeper.unlock();

                if (isFinished) {
                    clearAlarmState();
                    remainingMs = initialDurationMs;
                }

                if (isRunning || remainingMs <= 0) return;

                isRunning = true;
                isStarted = true;
                endTimeTimestamp = performance.now() + remainingMs;

                statusBadge.classList.add('hidden');
                updateVisuals();

                rafId = requestAnimationFrame(tick);
            }

            function stopTimer() {
                if (isFinished) {
                    clearAlarmState();
                    isStarted = false;
                    statusBadge.classList.add('hidden');
                    updateVisuals();
                    return;
                }

                if (!isRunning) return;

                isRunning = false;
                if (rafId) cancelAnimationFrame(rafId);
                remainingMs = Math.max(0, endTimeTimestamp - performance.now());

                statusBadge.textContent = 'Pause';
                statusBadge.className = 'text-xs font-semibold uppercase tracking-wider text-amber-400 mb-0.5';
                updateVisuals();
            }

            function resetTimer() {
                isRunning = false;
                isStarted = false;
                if (rafId) cancelAnimationFrame(rafId);
                clearAlarmState();

                remainingMs = initialDurationMs;
                statusBadge.classList.add('hidden');
                updateVisuals();
            }

            function setDuration(ms, matchedPresetMinutes = null) {
                beeper.unlock();
                isRunning = false;
                isStarted = false;
                if (rafId) cancelAnimationFrame(rafId);
                clearAlarmState();

                initialDurationMs = Math.max(1000, ms);
                remainingMs = initialDurationMs;

                statusBadge.classList.add('hidden');

                highlightPreset(matchedPresetMinutes);
                updateVisuals();
            }

            function handleAdjustDelta(deltaMs) {
                beeper.unlock();
                if (isFinished) clearAlarmState();

                if (isRunning) {
                    endTimeTimestamp = Math.max(performance.now() + 1000, endTimeTimestamp + deltaMs);
                    remainingMs = endTimeTimestamp - performance.now();
                    initialDurationMs = Math.max(initialDurationMs, remainingMs);
                } else {
                    const nextMs = Math.max(5000, remainingMs + deltaMs);
                    initialDurationMs = nextMs;
                    remainingMs = nextMs;
                    statusBadge.classList.add('hidden');
                    const matchedPreset = (nextMs % 60000 === 0 && [1, 2, 5, 10, 15].includes(nextMs / 60000)) ? (nextMs / 60000) : null;
                    highlightPreset(matchedPreset);
                }
                updateVisuals();
            }

            async function handleSoundToggle() {
                const currentStatus = beeper.getAudioStatus();

                if (currentStatus === 'pending') {
                    beeper.soundEnabled = true;
                    await beeper.unlock();
                    beeper.playBeep(880, 0.08);
                } else if (currentStatus === 'ready') {
                    beeper.soundEnabled = false;
                    beeper.stopAlarm();
                    updateSoundIconUI('muted');
                } else {
                    beeper.soundEnabled = true;
                    await beeper.unlock();
                    beeper.playBeep(880, 0.08);
                }
            }

            function openEditModal() {
                stopTimer();
                const totalSec = Math.ceil(remainingMs / 1000);
                inputMin.value = Math.floor(totalSec / 60);
                inputSec.value = totalSec % 60;
                editModal.classList.remove('hidden');
                editModal.classList.add('flex');
                inputMin.focus();
                inputMin.select();
            }

            function closeModal() {
                editModal.classList.add('hidden');
                editModal.classList.remove('flex');
            }

            function applyEditModal() {
                const m = Math.max(0, Math.min(180, parseInt(inputMin.value, 10) || 0));
                const s = Math.max(0, Math.min(59, parseInt(inputSec.value, 10) || 0));
                const totalMs = (m * 60 + s) * 1000;
                if (totalMs > 0) {
                    const matchedPreset = (s === 0 && [1, 2, 5, 10, 15].includes(m)) ? m : null;
                    setDuration(totalMs, matchedPreset);
                }
                closeModal();
            }

            /**
             * Délégation globale des clics (résiliente aux transferts DOM et PiP)
             */
            function handleDelegatedClick(e) {
                const target = e.target;
                if (!target || typeof target.closest !== 'function') return;

                if (target.closest('#btn-start')) {
                    startTimer();
                    return;
                }
                if (target.closest('#btn-stop')) {
                    stopTimer();
                    return;
                }
                if (target.closest('#btn-reset')) {
                    resetTimer();
                    return;
                }
                if (target.closest('#sound-toggle-btn')) {
                    handleSoundToggle();
                    return;
                }
                if (target.closest('#pip-toggle-btn')) {
                    toggleDocumentPiP();
                    return;
                }
                if (target.closest('#pip-restore-btn')) {
                    restoreFromPip();
                    return;
                }
                if (target.closest('#time-display-btn')) {
                    openEditModal();
                    return;
                }
                if (target.closest('#modal-cancel') || target === editModal) {
                    closeModal();
                    return;
                }
                if (target.closest('#modal-confirm')) {
                    applyEditModal();
                    return;
                }

                const presetBtn = target.closest('[data-minutes]');
                if (presetBtn) {
                    const minutes = parseInt(presetBtn.dataset.minutes, 10);
                    if (!isNaN(minutes)) {
                        setDuration(minutes * 60 * 1000, minutes);
                    }
                    return;
                }

                const adjustBtn = target.closest('[data-adjust]');
                if (adjustBtn) {
                    const deltaSec = parseInt(adjustBtn.dataset.adjust, 10);
                    if (!isNaN(deltaSec)) {
                        handleAdjustDelta(deltaSec * 1000);
                    }
                    return;
                }
            }

            document.addEventListener('click', handleDelegatedClick);

            // Attache aussi la délégation lors de l'ouverture du Picture-in-Picture
            const originalToggleDocumentPiP = toggleDocumentPiP;
            toggleDocumentPiP = async function () {
                await originalToggleDocumentPiP();
                if (pipWindow && !pipWindow.closed && !pipWindow.document._delegationBound) {
                    pipWindow.document.addEventListener('click', handleDelegatedClick);
                    pipWindow.document._delegationBound = true;
                }
            };

            function handleGlobalKeydown(e) {
                if (!editModal.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeModal();
                    if (e.key === 'Enter') applyEditModal();
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    if (isRunning || isFinished) {
                        stopTimer();
                    } else {
                        startTimer();
                    }
                } else if (e.key.toLowerCase() === 'r') {
                    resetTimer();
                }
            }

            window.addEventListener('keydown', handleGlobalKeydown);

            updateVisuals();
        });
    </script>
